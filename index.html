<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Tugas Siswa - SMAN 1 Cidahu</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Lucide untuk ikon -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Memuat PDF.js untuk membaca file PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="flex min-h-screen bg-slate-50 font-sans text-slate-800">
    <!-- Sidebar -->
    <div class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col py-6 shadow-sm">
        <div class="px-6 mb-6 flex flex-col items-center text-center">
            <img src="Logo_sman_1_cidahu_original.png" alt="Logo SMAN 1 Cidahu" 
                 class="w-24 h-24 object-contain mb-3 drop-shadow-sm"
                 onerror="this.onerror=null; this.src='https://placehold.co/150x150/13638d/FFFFFF?text=SMAN+1+Cidahu';">
            <h1 class="text-xl font-bold text-slate-800 w-full">SMAN 1 <span class="text-[#13638d]">Cidahu</span></h1>
            <p class="text-xs text-slate-500 mt-1">Solusi Cerdas Pengajar</p>
        </div>
        <div class="flex-1 overflow-y-auto">
            <button class="w-full flex items-center px-6 py-3 text-sm font-medium transition-colors duration-200 bg-slate-100 border-l-4 border-[#13638d] text-slate-900">
                <i data-lucide="brain-circuit" class="w-5 h-5 mr-3 text-[#13638d]"></i>
                Cek Tugas siswa
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-4 md:p-8 overflow-y-auto flex flex-col items-center justify-start">
        <div class="w-full max-w-4xl flex flex-col gap-6">
            
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="brain-circuit" class="w-8 h-8 text-[#13638d]"></i>
                    Periksa Kejujuran Siswa
                </h2>
            </div>

            <!-- Main Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[500px] transition-all duration-300">
                
                <div id="error-container" class="hidden bg-red-50 text-red-600 px-4 py-3 border-b border-red-100 items-center gap-2 rounded-t-2xl">
                    <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0"></i>
                    <p id="error-msg" class="text-sm"></p>
                </div>

                <textarea id="text-input"
                    class="flex-1 w-full p-6 resize-none outline-none text-slate-700 bg-transparent placeholder-slate-400 text-lg leading-relaxed disabled:opacity-50"
                    placeholder="Masukkan teks atau unggah file PDF tugas siswa untuk mengecek plagiarisme AI..."></textarea>

                <div class="p-4 md:p-6 border-t border-slate-100 flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-50/50 rounded-b-2xl">
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <button id="analyze-btn" class="bg-[#13638d] hover:bg-[#0f4f72] text-white px-8 py-3 rounded-lg font-medium transition-all shadow-sm disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center min-w-[160px]">
                            Deteksi Teks
                        </button>

                        <input type="file" id="file-input" accept=".pdf,.txt" class="hidden" />
                        
                        <button id="upload-btn" class="flex items-center gap-2 text-slate-600 hover:text-slate-900 px-4 py-3 rounded-lg hover:bg-slate-100 transition-colors disabled:opacity-50 font-medium">
                            <i data-lucide="upload" class="w-5 h-5"></i>
                            Unggah File PDF
                        </button>
                    </div>

                    <div class="text-right w-full md:w-auto">
                        <p class="text-sm text-slate-500 font-medium">
                            <span id="char-count">0</span>/15,000 Karakter
                        </p>
                    </div>
                </div>
            </div>

            <!-- Result Section -->
            <div id="result-container" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <h3 class="text-xl font-bold text-slate-800 mb-6 border-b pb-4 flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-6 h-6 text-green-600"></i>
                    Hasil Analisis AI
                </h3>
                
                <div class="flex flex-col md:flex-row gap-8 items-start">
                    <div class="flex flex-col items-center justify-center p-6 bg-slate-50 rounded-2xl border border-slate-100 min-w-[200px] w-full md:w-auto">
                        <div id="score-circle" class="relative w-32 h-32 flex items-center justify-center rounded-full bg-white shadow-sm border-[8px] border-green-500">
                            <span id="score-text" class="text-3xl font-bold text-slate-800">0%</span>
                        </div>
                        <p class="mt-4 text-sm font-bold text-slate-600 uppercase tracking-wider">Skor AI</p>
                        <p id="verdict-text" class="mt-1 text-lg font-bold text-green-600"></p>
                    </div>

                    <div class="flex-1 space-y-4">
                        <h4 class="font-semibold text-slate-800 text-lg">Catatan Analisis:</h4>
                        <p id="explanation-text" class="text-slate-600 leading-relaxed text-justify"></p>
                        
                        <div id="advice-box" class="mt-4 p-4 rounded-xl border bg-green-50 border-green-100 text-green-800">
                            <strong>Saran untuk Guru: </strong> 
                            <span id="advice-text"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi ikon Lucide
        lucide.createIcons();
        
        // Setup worker PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const API_KEY = "AQ.Ab8RN6IczcwZ9sUYLA5W0DClfP9KvLKHcPxNcGPzq0j2y_18TA"; // Masukkan API Key Anda di sini
        const MAX_CHARS = 15000;
        let isAnalyzing = false;

        const textInput = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const analyzeBtn = document.getElementById('analyze-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        
        const errorContainer = document.getElementById('error-container');
        const errorMsg = document.getElementById('error-msg');
        
        const resultContainer = document.getElementById('result-container');
        const scoreCircle = document.getElementById('score-circle');
        const scoreText = document.getElementById('score-text');
        const verdictText = document.getElementById('verdict-text');
        const explanationText = document.getElementById('explanation-text');
        const adviceBox = document.getElementById('advice-box');
        const adviceText = document.getElementById('advice-text');

        textInput.addEventListener('input', (e) => {
            if (textInput.value.length > MAX_CHARS) {
                textInput.value = textInput.value.substring(0, MAX_CHARS);
            }
            charCount.textContent = textInput.value.length.toLocaleString();
            hideResult();
        });

        uploadBtn.addEventListener('click', () => {
            if (!isAnalyzing) fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            hideError();
            hideResult();

            if (file.type === 'application/pdf') {
                try {
                    setLoading(true);
                    textInput.value = 'Sedang mengekstrak teks dari PDF...';
                    
                    const fileReader = new FileReader();
                    fileReader.onload = async function() {
                        try {
                            const typedarray = new Uint8Array(this.result);
                            const pdf = await pdfjsLib.getDocument(typedarray).promise;
                            
                            let fullText = '';
                            const maxPages = Math.min(pdf.numPages, 10); 
                            
                            for (let i = 1; i <= maxPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                const pageText = textContent.items.map(item => item.str).join(' ');
                                fullText += pageText + '\n\n';
                            }
                            
                            fullText = fullText.replace(/\s+/g, ' ').trim();
                            
                            if (fullText.length > MAX_CHARS) {
                                fullText = fullText.substring(0, MAX_CHARS);
                                showError(`Teks terlalu panjang. Hanya ${MAX_CHARS} karakter pertama yang diambil.`);
                            }
                            
                            textInput.value = fullText;
                            charCount.textContent = fullText.length.toLocaleString();
                            setLoading(false);
                        } catch (err) {
                            console.error(err);
                            showError('Gagal membaca isi PDF. Pastikan file tidak rusak atau diproteksi password.');
                            textInput.value = '';
                            setLoading(false);
                        }
                    };
                    fileReader.readAsArrayBuffer(file);
                } catch (err) {
                    showError('Terjadi kesalahan saat memproses file PDF.');
                    setLoading(false);
                }
            } else if (file.type === 'text/plain') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    let content = e.target.result;
                    if (content.length > MAX_CHARS) {
                        content = content.substring(0, MAX_CHARS);
                    }
                    textInput.value = content;
                    charCount.textContent = content.length.toLocaleString();
                };
                reader.readAsText(file);
            } else {
                showError('Format file tidak didukung. Harap unggah file PDF atau TXT.');
            }
            
            e.target.value = ''; 
        });

        analyzeBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text || text === 'Sedang mengekstrak teks dari PDF...') {
                showError('Teks masih kosong. Silakan ketik atau unggah file terlebih dahulu.');
                return;
            }

            setLoading(true, true);
            hideError();
            hideResult();

            const systemPrompt = `Kamu adalah seorang ahli linguistik forensik dan guru SMA yang berpengalaman di Indonesia. 
Tugasmu adalah menganalisis teks tugas siswa dan mendeteksi apakah teks tersebut murni ditulis oleh manusia (siswa) atau dihasilkan oleh AI (seperti ChatGPT, Gemini, Claude, dll).
Perhatikan gaya bahasa, repetisi, kompleksitas kalimat, dan frasa khas AI (seperti "penting untuk diingat", "secara kesimpulan", dll) dalam konteks bahasa Indonesia.

Berikan analisis dalam format JSON murni dengan struktur berikut:
{
  "aiProbability": (angka 0-100, mewakili persentase kemungkinan dibuat oleh AI),
  "verdict": (string singkat: "Kemungkinan Besar AI", "Mungkin Campuran", atau "Murni Manusia"),
  "explanation": (string penjelasan detail dalam bahasa Indonesia tentang mengapa kamu memberikan skor tersebut, berikan contoh frasa yang mencurigakan jika ada)
}`;

            const userQuery = `Teks tugas siswa: 

${text}`;

            let delay = 1000;
            let attempts = 0;
            const maxAttempts = 5;

            while (attempts < maxAttempts) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { 
                                responseMimeType: "application/json",
                            }
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (jsonText) {
                        const parsedResult = JSON.parse(jsonText);
                        showResult(parsedResult);
                        setLoading(false);
                        return;
                    } else {
                        throw new Error('Respons kosong dari AI.');
                    }

                } catch (error) {
                    attempts++;
                    console.error(`Attempt ${attempts} failed:`, error);
                    if (attempts >= maxAttempts) {
                        showError('Gagal terhubung ke server AI setelah beberapa kali percobaan. Silakan coba lagi nanti.');
                        setLoading(false);
                        break;
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        });

        function setLoading(isLoading, isDetecting = false) {
            isAnalyzing = isLoading;
            textInput.disabled = isLoading;
            uploadBtn.disabled = isLoading;
            analyzeBtn.disabled = isLoading || !textInput.value.trim();
            
            if (isLoading && isDetecting) {
                analyzeBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Mendeteksi...';
                lucide.createIcons();
            } else {
                analyzeBtn.innerHTML = 'Deteksi Teks';
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorContainer.classList.remove('hidden');
            errorContainer.classList.add('flex');
        }

        function hideError() {
            errorContainer.classList.add('hidden');
            errorContainer.classList.remove('flex');
        }

        function showResult(result) {
            scoreText.textContent = result.aiProbability + '%';
            verdictText.textContent = result.verdict;
            explanationText.textContent = result.explanation;

            if (result.aiProbability > 70) {
                scoreCircle.style.borderColor = '#ef4444'; 
                verdictText.className = 'mt-1 text-lg font-bold text-red-600';
                adviceBox.className = 'mt-4 p-4 rounded-xl border bg-red-50 border-red-100 text-red-800';
                adviceText.textContent = "Teks ini memiliki pola yang sangat identik dengan AI. Disarankan untuk memanggil siswa dan melakukan tanya jawab lisan terkait isi tugasnya untuk mengonfirmasi pemahaman mereka.";
            } else if (result.aiProbability > 30) {
                scoreCircle.style.borderColor = '#f59e0b'; 
                verdictText.className = 'mt-1 text-lg font-bold text-amber-600';
                adviceBox.className = 'mt-4 p-4 rounded-xl border bg-amber-50 border-amber-100 text-amber-800';
                adviceText.textContent = "Ada beberapa bagian yang mungkin disempurnakan atau dibantu oleh AI. Coba periksa apakah sumber referensi yang disertakan valid.";
            } else {
                scoreCircle.style.borderColor = '#10b981'; 
                verdictText.className = 'mt-1 text-lg font-bold text-green-600';
                adviceBox.className = 'mt-4 p-4 rounded-xl border bg-green-50 border-green-100 text-green-800';
                adviceText.textContent = "Gaya penulisan natural dan bervariasi. Sangat mungkin ini murni hasil pemikiran dan ketikan siswa.";
            }

            resultContainer.classList.remove('hidden');
            setTimeout(() => {
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function hideResult() {
            resultContainer.classList.add('hidden');
        }
    </script>
</body>
</html>
